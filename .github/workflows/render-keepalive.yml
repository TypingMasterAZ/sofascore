name: Render Keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render health endpoint
        env:
          KEEPALIVE_URL: https://sofascore-xoyr.onrender.com/api/ping
        run: |
          echo "Pinging ${KEEPALIVE_URL}"
          curl --fail --silent --show-error --max-time 30 "${KEEPALIVE_URL}?t=$(date +%s)"
