services:
  - type: web
    name: proscore-live
    runtime: node
    plan: free # Change if needed
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: SOFA_PROXY_URL
        sync: false
      - key: GAS_PROXY_URL
        value: https://script.google.com/macros/s/AKfycbwFuXK4oHJIAjMoCxPEMeh5hH5jn10PGYEEo048pnmQLFNQoI-M0Fqr5-NZ1wyITYJQrQ/exec
      - key: LIVE_PRIMARY_SOURCE
        value: sofascore
      - key: ALLOW_MACKOLIK_FALLBACK
        value: "false"
      - key: RAPIDAPI_KEY
        sync: false
      - key: WEB_PUSH_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_SUBJECT
        sync: false

  - type: cron
    name: proscore-live-keepalive
    runtime: node
    schedule: "*/5 * * * *"
    buildCommand: npm install
    startCommand: npm run keepalive
    envVars:
      - key: KEEPALIVE_URL
        value: https://sofascore-xoyr.onrender.com
