services:
  - type: web
    name: proscore-live
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: SOFA_PROXY_URL
        sync: false
      - key: GAS_PROXY_URL
        value: https://script.google.com/macros/s/AKfycbwFuXK4oHJIAjMoCxPEMeh5hH5jn10PGYEEo048pnmQLFNQoI-M0Fqr5-NZ1wyITYJQrQ/exec
      - key: LIVE_PRIMARY_SOURCE
        value: sofascore
      - key: ALLOW_MACKOLIK_FALLBACK
        value: "false"
      - key: KEEPALIVE_ENABLED
        value: "true"
      - key: KEEPALIVE_URL
        value: https://sofascore-xoyr.onrender.com
      - key: RENDER_EXTERNAL_URL
        value: https://sofascore-xoyr.onrender.com
      # Server hec vaxt yatmasin - aggressiv intervallar
      - key: RUNTIME_WARMUP_INTERVAL_MS
        value: "15000"
      - key: SELF_PING_INTERVAL_MS
        value: "25000"
      - key: CATEGORY_WARMUP_INTERVAL_MS
        value: "120000"
      # Canli neticeler her 12 saniyede bir (IP bloklanmamasi ucun)
      - key: LIVE_SCORE_POLL_INTERVAL_MS
        value: "12000"
      # Arxa fonda canli oyun hadiselerini her 5 saniyede yenile
      - key: BACKGROUND_REFRESH_INTERVAL_MS
        value: "5000"
      - key: RAPIDAPI_KEY
        sync: false
      - key: WEB_PUSH_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_SUBJECT
        sync: false

  # Render free plan: server 15 deq hereketsizden sonra yatir.
  # Bu cron job her deqiqe servere ping vurur - server HECH VAXT yatmir.
  - type: cron
    name: proscore-live-keepalive
    runtime: node
    schedule: "* * * * *"   # Her deqiqe - Render-in minimum limiti
    buildCommand: npm install
    startCommand: npm run keepalive
    envVars:
      - key: KEEPALIVE_URL
        value: https://sofascore-xoyr.onrender.com
