<!doctype html>
<html lang="az">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    <title>Rabona Media LIVE</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #020617;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        text-align: center;
      }

      .loader {
        width: 44px;
        height: 44px;
        margin: 0 auto 18px;
        border: 4px solid rgba(148, 163, 184, 0.25);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.85s linear infinite;
      }

      .title {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .text {
        margin-top: 8px;
        color: #94a3b8;
        font-size: 14px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="loader"></div>
      <div class="title">Rabona Media LIVE</div>
      <div class="text">Yuklenir...</div>
    </main>
  </body>
</html>
